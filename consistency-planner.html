<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>꾸준함 기록지</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #fffdf8;
    --ink: #20201d;
    --muted: #716b61;
    --line: #ddd5c7;
    --deep: #274653;
    --teal: #287271;
    --coral: #e76f51;
    --gold: #d89b2b;
    --green: #3c7d4d;
    --blue: #456ca8;
    --shadow: 0 14px 32px rgba(35, 31, 25, .08);
    --focus: 0 0 0 3px rgba(40, 114, 113, .18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      linear-gradient(180deg, rgba(39, 70, 83, .08), transparent 310px),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    line-height: 1.45;
  }

  button, input, textarea { font: inherit; }
  button { cursor: pointer; }

  .wrap {
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 18px;
  }

  .top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 18px;
    align-items: end;
    margin: 12px 0 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 56px);
    line-height: 1.02;
    letter-spacing: 0;
  }

  .sub {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  .top-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .streak {
    min-width: 156px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .streak span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 750;
  }

  .streak strong {
    display: block;
    margin-top: 2px;
    font-size: 31px;
    line-height: 1;
    color: var(--teal);
  }

  .streak strong.gold {
    color: var(--gold);
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tab, .btn {
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fffaf1;
    color: #332f29;
    padding: 0 14px;
    font-weight: 800;
  }

  .tab.active, .btn.primary {
    background: var(--deep);
    border-color: var(--deep);
    color: #fff;
  }

  .btn.teal {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }

  .btn.light {
    background: #fff;
  }

  .btn.warn {
    background: #fff1ea;
    border-color: #e3b9a7;
    color: #7d321b;
  }

  .btn:disabled {
    opacity: .48;
    cursor: default;
  }

  .page { display: none; }
  .page.active { display: block; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 14px;
    align-items: start;
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .panel-head h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0;
  }

  .name-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    margin-bottom: 14px;
  }

  input[type="text"], textarea {
    width: 100%;
    border: 1px solid #cfc6b8;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }

  input[type="text"] {
    min-height: 44px;
    padding: 0 12px;
  }

  textarea {
    min-height: 86px;
    resize: vertical;
    padding: 10px 12px;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--teal);
    box-shadow: var(--focus);
  }

  .hello {
    display: none;
    border: 1px solid #b8d3c8;
    background: #eff9f4;
    color: #235a3c;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 750;
  }

  .hello.show { display: block; }

  .form-area { display: none; }
  .form-area.show { display: block; }

  .metric {
    border-top: 1px solid #eee6d8;
    padding: 15px 0;
  }

  .metric:first-child {
    border-top: 0;
    padding-top: 0;
  }

  .metric-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 72px;
    gap: 12px;
    align-items: start;
    margin-bottom: 10px;
  }

  .metric-title {
    margin: 0;
    font-weight: 850;
  }

  .metric-desc {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
  }

  .value-pill {
    min-height: 34px;
    display: grid;
    place-items: center;
    border: 1px solid #bed0ca;
    background: #eef8f5;
    color: var(--teal);
    border-radius: 999px;
    font-weight: 900;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--teal);
  }

  .range-labels {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
  }

  .choice-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .choice {
    min-height: 54px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: #2e2a25;
    padding: 8px;
    text-align: left;
  }

  .choice strong {
    display: block;
    font-size: 13px;
  }

  .choice span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
  }

  .choice.active {
    border-color: var(--teal);
    background: #edf8f4;
    box-shadow: var(--focus);
  }

  .template-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    margin-top: 10px;
  }

  .field-label {
    display: block;
    margin-bottom: 6px;
    color: #3b352f;
    font-size: 13px;
    font-weight: 850;
  }

  .result-hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid #eee6d8;
    margin-bottom: 16px;
  }

  .level {
    margin: 0;
    font-size: clamp(27px, 4vw, 44px);
    line-height: 1.06;
    letter-spacing: 0;
  }

  .level-badge {
    border-radius: 999px;
    padding: 8px 13px;
    border: 1px solid var(--line);
    background: #fffaf1;
    font-weight: 900;
    white-space: nowrap;
  }

  .level-badge.tiny { color: #7d321b; background: #fff1ea; border-color: #e3b9a7; }
  .level-badge.light { color: var(--gold); background: #fff7de; border-color: #e7d19a; }
  .level-badge.steady { color: var(--teal); background: #edf8f4; border-color: #a8cec4; }
  .level-badge.push { color: var(--blue); background: #eef4ff; border-color: #b6c8e8; }

  .plan-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .task {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 10px;
    align-items: start;
    border: 1px solid #eee6d8;
    background: #fff;
    border-radius: 8px;
    padding: 12px;
  }

  .task input {
    width: 22px;
    height: 22px;
    margin: 1px 0 0;
    accent-color: var(--teal);
  }

  .task-title {
    margin: 0;
    font-weight: 850;
  }

  .task-meta {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .task.done .task-title {
    text-decoration: line-through;
    color: var(--muted);
  }

  .score-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }

  .score {
    border: 1px solid #eee6d8;
    border-radius: 8px;
    padding: 10px;
    background: #fffaf1;
  }

  .score span {
    display: block;
    color: var(--muted);
    font-size: 12px;
  }

  .score strong {
    display: block;
    margin-top: 2px;
    font-size: 22px;
  }

  .side-note {
    border: 1px solid #e6d2a9;
    background: #fff8e8;
    color: #594223;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
  }

  .avatar-card {
    display: grid;
    grid-template-columns: 118px minmax(0, 1fr);
    gap: 12px;
    align-items: center;
    border: 1px solid #d7e4df;
    background: #f1faf6;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .avatar-stage {
    position: relative;
    width: 106px;
    aspect-ratio: 1;
    border: 1px solid #cad8d3;
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(160deg, #e8f5f0, #fffaf1);
  }

  .avatar-stage.dawn { background: linear-gradient(160deg, #fff1df, #e9f6f2); }
  .avatar-stage.grove { background: linear-gradient(160deg, #def1e4, #f8fff2); }
  .avatar-stage.night { background: linear-gradient(160deg, #263a47, #7b6ba8); }
  .avatar-stage.gold { background: linear-gradient(160deg, #fff1bd, #f2c15d); }

  .avatar-body {
    position: absolute;
    z-index: 2;
    left: 31px;
    bottom: 14px;
    width: 44px;
    height: 48px;
    border: 2px solid rgba(32, 32, 29, .22);
    border-radius: 18px 18px 12px 12px;
    background: var(--teal);
  }

  .avatar-body.starter { background: var(--teal); }
  .avatar-body.forest { background: var(--green); }
  .avatar-body.ember { background: var(--coral); }
  .avatar-body.midnight { background: var(--deep); }
  .avatar-body.royal { background: #7353a4; }

  .avatar-head {
    position: absolute;
    z-index: 3;
    left: 34px;
    top: 18px;
    width: 38px;
    height: 38px;
    border: 2px solid rgba(32, 32, 29, .22);
    border-radius: 50%;
    background: #f2cda8;
  }

  .avatar-eye {
    position: absolute;
    z-index: 4;
    top: 33px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2b2721;
  }

  .avatar-eye.left { left: 46px; }
  .avatar-eye.right { right: 46px; }

  .avatar-accessory {
    position: absolute;
    z-index: 5;
    left: 28px;
    top: 10px;
    width: 50px;
    height: 18px;
    display: none;
  }

  .avatar-accessory.headband {
    display: block;
    top: 22px;
    height: 8px;
    border-radius: 999px;
    background: #e8bd4c;
  }

  .avatar-accessory.cape {
    display: block;
    z-index: 1;
    left: 25px;
    top: 54px;
    width: 56px;
    height: 36px;
    border-radius: 8px 8px 18px 18px;
    background: rgba(231, 111, 81, .78);
  }

  .avatar-accessory.crown {
    display: block;
    top: 7px;
    height: 18px;
    background:
      linear-gradient(135deg, transparent 0 18%, #d89b2b 19% 38%, transparent 39%),
      linear-gradient(45deg, transparent 0 18%, #f1c75b 19% 38%, transparent 39%);
    background-color: #d89b2b;
    clip-path: polygon(0 100%, 12% 38%, 30% 100%, 50% 20%, 70% 100%, 88% 38%, 100% 100%);
  }

  .avatar-badge {
    position: absolute;
    right: 9px;
    bottom: 9px;
    min-width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(32, 32, 29, .18);
    border-radius: 50%;
    background: #fff;
    color: var(--deep);
    font-size: 10px;
    font-weight: 950;
  }

  .avatar-info h3 {
    margin: 0;
    font-size: 16px;
  }

  .avatar-info p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .xp-track {
    height: 10px;
    border-radius: 999px;
    background: #d9e2de;
    overflow: hidden;
    margin-top: 10px;
  }

  .xp-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--teal), var(--gold));
  }

  .avatar-shop {
    display: grid;
    gap: 10px;
    margin-bottom: 12px;
  }

  .shop-group {
    border-top: 1px solid #eee6d8;
    padding-top: 10px;
  }

  .shop-title {
    margin: 0 0 8px;
    color: #3b352f;
    font-size: 13px;
    font-weight: 900;
  }

  .shop-items {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }

  .shop-item {
    min-height: 46px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: #302b25;
    padding: 7px 8px;
    text-align: left;
  }

  .shop-item strong {
    display: block;
    font-size: 12px;
  }

  .shop-item span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
  }

  .shop-item.active {
    border-color: var(--teal);
    background: #edf8f4;
  }

  .shop-item.locked {
    opacity: .58;
    cursor: default;
  }

  .today-mini {
    display: grid;
    gap: 8px;
    margin-top: 12px;
  }

  .name-history {
    margin-top: 14px;
    display: grid;
    gap: 8px;
  }

  .name-record {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    border: 1px solid #eee6d8;
    background: #fff;
    border-radius: 8px;
    padding: 10px;
  }

  .name-record-title {
    font-size: 13px;
    font-weight: 900;
  }

  .name-record-meta {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
  }

  .mini-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid #eee6d8;
    padding: 8px 0;
    font-size: 13px;
  }

  .mini-row:last-child { border-bottom: 0; }
  .mini-row strong { color: var(--teal); }

  .hist-tools {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip {
    min-height: 34px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 850;
  }

  .chip.active {
    background: var(--deep);
    border-color: var(--deep);
    color: #fff;
  }

  .hist-list {
    display: grid;
    gap: 8px;
  }

  .hist-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    border: 1px solid #eee6d8;
    background: #fff;
    border-radius: 8px;
    padding: 12px;
  }

  .hist-title {
    font-weight: 900;
  }

  .hist-item time {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }

  .hist-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  .bar-list {
    display: grid;
    gap: 10px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 94px minmax(0, 1fr) 66px;
    gap: 10px;
    align-items: center;
    font-size: 13px;
  }

  .bar-track {
    height: 12px;
    border-radius: 999px;
    background: #ece4d8;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--teal), var(--green));
  }

  .empty {
    border: 1px dashed #cfc6b8;
    border-radius: 8px;
    background: #fffaf1;
    color: var(--muted);
    text-align: center;
    padding: 24px;
  }

  @media (max-width: 880px) {
    .top, .layout { grid-template-columns: 1fr; }
    .top-stats { justify-content: stretch; }
    .streak { width: 100%; }
    .plan-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 560px) {
    .wrap { padding: 12px; }
    .panel { padding: 14px; }
    .name-row, .template-row { grid-template-columns: 1fr; }
    .choice-grid, .score-strip { grid-template-columns: 1fr; }
    .result-hero, .hist-item, .bar-row { grid-template-columns: 1fr; }
    .avatar-card { grid-template-columns: 1fr; }
    .shop-items { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>꾸준함 기록지</h1>
      <p class="sub">오늘 컨디션에 맞춰 운동과 학습 계획을 작게 만들고, 완료한 만큼 기록합니다.</p>
    </div>
    <div class="top-stats">
      <div class="streak">
        <span>현재 연속 기록</span>
        <strong id="streak-count">0일</strong>
      </div>
      <div class="streak">
        <span>누적 포인트</span>
        <strong class="gold" id="point-count">0P</strong>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="화면 전환">
    <button class="tab active" type="button" data-page="make">오늘 계획</button>
    <button class="tab" type="button" data-page="history">이력</button>
    <button class="tab" type="button" data-page="stats">흐름</button>
  </nav>

  <section class="page active" id="page-make">
    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>컨디션 입력</h2>
          <button class="btn light" type="button" id="reset-btn">초기화</button>
        </div>

        <div class="name-row" id="name-row">
          <input id="name-input" type="text" autocomplete="name" placeholder="이름을 입력하세요" />
          <button class="btn teal" type="button" id="name-confirm" disabled>확인</button>
        </div>
        <div class="hello" id="hello"></div>

        <form class="form-area" id="plan-form">
          <div id="metrics"></div>

          <div class="metric">
            <div class="metric-head">
              <div>
                <p class="metric-title">오늘의 목표 방향</p>
                <p class="metric-desc">둘 다 해도 좋지만, 힘든 날에는 한쪽만 잡아도 성공입니다.</p>
              </div>
            </div>
            <div class="choice-grid" id="focus-choices">
              <button class="choice active" type="button" data-focus="both"><strong>균형</strong><span>운동 + 학습</span></button>
              <button class="choice" type="button" data-focus="exercise"><strong>운동 중심</strong><span>몸부터 깨우기</span></button>
              <button class="choice" type="button" data-focus="study"><strong>학습 중심</strong><span>머리부터 켜기</span></button>
            </div>
          </div>

          <div class="template-row">
            <div>
              <label class="field-label" for="exercise-template">운동 후보</label>
              <textarea id="exercise-template">5분 산책
스쿼트 10회
스트레칭 5분
물 마시고 계단 1층 오르기</textarea>
            </div>
            <div>
              <label class="field-label" for="study-template">학습 후보</label>
              <textarea id="study-template">책 2쪽 읽기
강의 5분 듣기
단어 5개 보기
노트 3줄 정리</textarea>
            </div>
          </div>

          <button class="btn primary" type="submit" style="width:100%;margin-top:14px;">오늘 계획 만들기</button>
        </form>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <h2>오늘 기준</h2>
        </div>
        <div class="side-note">
          성공 기준은 “많이 하기”가 아니라 “끊기지 않기”입니다. 가장 힘든 날의 최소 단위는 1개로 고정됩니다.
        </div>
        <div class="avatar-card" id="avatar-card"></div>
        <div class="avatar-shop" id="avatar-shop"></div>
        <div class="today-mini" id="live-summary"></div>
        <div class="name-history" id="name-history"></div>
      </aside>
    </div>
  </section>

  <section class="page" id="page-result">
    <section class="panel" id="result-panel"></section>
  </section>

  <section class="page" id="page-history">
    <section class="panel">
      <div class="panel-head">
        <h2>저장된 기록</h2>
      </div>
      <div class="hist-tools">
        <div class="chips" id="history-chips"></div>
        <div>
          <button class="btn light" id="export-btn" type="button">JSON 내보내기</button>
          <button class="btn warn" id="clear-btn" type="button">이력 삭제</button>
        </div>
      </div>
      <div class="hist-list" id="history-list"></div>
    </section>
  </section>

  <section class="page" id="page-stats">
    <section class="panel">
      <div class="panel-head">
        <h2>꾸준함 흐름</h2>
      </div>
      <div class="chips" id="stats-chips" style="margin-bottom:12px;"></div>
      <div id="stats-body"></div>
    </section>
  </section>
</main>

<script>
(() => {
  const STORAGE_KEY = 'consistencyPlannerRecordsV1';
  const AVATAR_KEY = 'consistencyPlannerAvatarV1';
  const metrics = [
    { id: 'energy', title: '몸 에너지', desc: '0 = 거의 없음 · 10 = 아주 좋음', low: '바닥', high: '좋음', value: 4 },
    { id: 'mind', title: '마음 여유', desc: '0 = 버거움 · 10 = 여유 있음', low: '버거움', high: '여유', value: 4 },
    { id: 'time', title: '쓸 수 있는 시간', desc: '0 = 5분 이하 · 10 = 60분 이상', low: '5분', high: '60분+', value: 4 },
    { id: 'burden', title: '오늘의 부담감', desc: '0 = 낮음 · 10 = 매우 높음', low: '낮음', high: '높음', value: 5 }
  ];

  const levelText = {
    tiny: {
      label: '최소 유지일',
      badge: 'tiny',
      message: '오늘은 딱 1개만 해도 성공입니다. 작게 해도 끊기지 않는 게 이깁니다.'
    },
    light: {
      label: '가볍게 유지일',
      badge: 'light',
      message: '무리하지 않고 2개 정도만 잡습니다. 끝내고 아쉬우면 보너스로 1개만 더합니다.'
    },
    steady: {
      label: '보통 진행일',
      badge: 'steady',
      message: '기본 루틴을 작게 나눠 3~4개까지 진행할 수 있는 날입니다.'
    },
    push: {
      label: '확장 가능일',
      badge: 'push',
      message: '컨디션이 괜찮습니다. 그래도 계획은 과하게 늘리지 않고 완료 가능한 범위로 둡니다.'
    }
  };

  const avatarItems = {
    body: [
      { id: 'starter', label: '기본 복장', cost: 0 },
      { id: 'forest', label: '초록 로브', cost: 80 },
      { id: 'ember', label: '불꽃 재킷', cost: 160 },
      { id: 'midnight', label: '밤색 코트', cost: 260 },
      { id: 'royal', label: '보라 망토', cost: 380 }
    ],
    accessory: [
      { id: 'none', label: '장식 없음', cost: 0 },
      { id: 'headband', label: '노란 머리띠', cost: 60 },
      { id: 'cape', label: '짧은 케이프', cost: 140 },
      { id: 'crown', label: '작은 왕관', cost: 320 }
    ],
    stage: [
      { id: 'plain', label: '기본 배경', cost: 0 },
      { id: 'dawn', label: '새벽 배경', cost: 100 },
      { id: 'grove', label: '초록 배경', cost: 180 },
      { id: 'night', label: '밤 배경', cost: 280 },
      { id: 'gold', label: '금빛 배경', cost: 420 }
    ],
    badge: [
      { id: 'I', label: '배지 I', cost: 0 },
      { id: 'II', label: '배지 II', cost: 120 },
      { id: 'III', label: '배지 III', cost: 240 },
      { id: 'IV', label: '배지 IV', cost: 420 }
    ]
  };

  let records = loadRecords();
  let avatarPrefs = loadAvatarPrefs();
  let state = {
    user: '',
    focus: 'both',
    values: Object.fromEntries(metrics.map((m) => [m.id, m.value]))
  };
  let historyFilter = 'all';
  let statsFilter = 'all';

  const $ = (id) => document.getElementById(id);

  function loadRecords() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function saveRecords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function loadAvatarPrefs() {
    try {
      const parsed = JSON.parse(localStorage.getItem(AVATAR_KEY) || '{}');
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch {
      return {};
    }
  }

  function saveAvatarPrefs() {
    localStorage.setItem(AVATAR_KEY, JSON.stringify(avatarPrefs));
  }

  function init() {
    renderMetrics();
    renderLiveSummary();
    renderRpg();
    renderNameHistory();
    updateStreak();
    bindEvents();
    renderHistory();
    renderStats();
  }

  function bindEvents() {
    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => showPage(tab.dataset.page));
    });

    $('name-input').addEventListener('input', () => {
      $('name-confirm').disabled = !$('name-input').value.trim();
    });

    $('name-input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && $('name-input').value.trim()) {
        event.preventDefault();
        confirmName();
      }
    });

    $('name-confirm').addEventListener('click', confirmName);
    $('reset-btn').addEventListener('click', resetForm);
    $('plan-form').addEventListener('submit', makePlan);
    $('export-btn').addEventListener('click', exportJson);
    $('clear-btn').addEventListener('click', clearHistory);

    document.querySelectorAll('.choice').forEach((button) => {
      button.addEventListener('click', () => {
        state.focus = button.dataset.focus;
        document.querySelectorAll('.choice').forEach((item) => item.classList.toggle('active', item === button));
        renderLiveSummary();
      });
    });
  }

  function renderMetrics() {
    $('metrics').innerHTML = metrics.map((metric) => `
      <section class="metric">
        <div class="metric-head">
          <div>
            <p class="metric-title">${metric.title}</p>
            <p class="metric-desc">${metric.desc}</p>
          </div>
          <div class="value-pill" id="value-${metric.id}">${state.values[metric.id]}점</div>
        </div>
        <input type="range" min="0" max="10" step="1" value="${state.values[metric.id]}" data-metric="${metric.id}" aria-label="${metric.title}" />
        <div class="range-labels"><span>${metric.low}</span><span>${metric.high}</span></div>
      </section>
    `).join('');

    document.querySelectorAll('[data-metric]').forEach((range) => {
      range.addEventListener('input', () => {
        state.values[range.dataset.metric] = Number(range.value);
        $(`value-${range.dataset.metric}`).textContent = `${range.value}점`;
        renderLiveSummary();
      });
    });
  }

  function confirmName() {
    const name = $('name-input').value.trim();
    if (!name) {
      alert('이름을 입력해 주세요.');
      return;
    }
    state.user = name;
    historyFilter = name;
    statsFilter = name;
    $('name-row').style.display = 'none';
    $('hello').textContent = `${name}님, 오늘 할 수 있는 만큼만 계획해볼게요.`;
    $('hello').classList.add('show');
    $('plan-form').classList.add('show');
    renderLiveSummary();
    renderRpg();
    renderNameHistory();
    renderHistory();
    renderStats();
  }

  function resetForm() {
    state = {
      user: '',
      focus: 'both',
      values: Object.fromEntries(metrics.map((m) => [m.id, m.value]))
    };
    $('name-input').value = '';
    $('name-confirm').disabled = true;
    $('name-row').style.display = 'grid';
    $('hello').classList.remove('show');
    $('plan-form').classList.remove('show');
    document.querySelectorAll('.choice').forEach((button) => button.classList.toggle('active', button.dataset.focus === 'both'));
    renderMetrics();
    renderLiveSummary();
    renderRpg();
    renderNameHistory();
    showPage('make');
  }

  function renderLiveSummary() {
    const calc = calculateCapacity(state.values);
    const focusLabel = { both: '운동 + 학습', exercise: '운동 중심', study: '학습 중심' }[state.focus];
    $('live-summary').innerHTML = `
      <div class="mini-row"><span>이름</span><strong>${state.user ? escapeHtml(state.user) : '-'}</strong></div>
      <div class="mini-row"><span>몸 에너지</span><strong>${state.values.energy}점</strong></div>
      <div class="mini-row"><span>마음 여유</span><strong>${state.values.mind}점</strong></div>
      <div class="mini-row"><span>시간</span><strong>${state.values.time}점</strong></div>
      <div class="mini-row"><span>부담감</span><strong>${state.values.burden}점</strong></div>
      <div class="mini-row"><span>목표 방향</span><strong>${focusLabel}</strong></div>
      <div class="mini-row"><span>추천 개수</span><strong>${calc.count}개</strong></div>
    `;
  }

  function renderRpg() {
    const totalPoints = records.reduce((sum, record) => sum + recordPoints(record), 0);
    if (!state.user) {
      $('point-count').textContent = `${totalPoints}P`;
      $('avatar-card').innerHTML = `
        <div class="avatar-stage">
          <div class="avatar-accessory none"></div>
          <div class="avatar-head"></div>
          <div class="avatar-eye left"></div>
          <div class="avatar-eye right"></div>
          <div class="avatar-body starter"></div>
          <div class="avatar-badge">I</div>
        </div>
        <div class="avatar-info">
          <h3>이름을 확인하면 캐릭터가 열립니다</h3>
          <p>완료한 기록으로 포인트와 레벨이 자동 계산됩니다.</p>
          <div class="xp-track"><div class="xp-fill" style="width:0%"></div></div>
        </div>
      `;
      $('avatar-shop').innerHTML = '';
      return;
    }

    const profile = calcUserProfile(state.user);
    const avatar = getAvatar(state.user, profile.points);
    const nextNeed = profile.level * 100;
    const progress = Math.min(100, Math.round(profile.currentXp / 100 * 100));
    $('point-count').textContent = `${profile.points}P`;
    $('avatar-card').innerHTML = `
      ${avatarHtml(avatar)}
      <div class="avatar-info">
        <h3>${escapeHtml(state.user)} · Lv.${profile.level}</h3>
        <p>${profile.points}P · 다음 레벨까지 ${Math.max(0, nextNeed - profile.points)}P</p>
        <p>성공한 날 ${profile.successDays}일 · 완료 ${profile.doneTasks}개</p>
        <div class="xp-track"><div class="xp-fill" style="width:${progress}%"></div></div>
      </div>
    `;
    renderAvatarShop(state.user, profile.points);
  }

  function avatarHtml(avatar) {
    const stage = avatar.stage === 'plain' ? '' : avatar.stage;
    const accessory = avatar.accessory === 'none' ? 'none' : avatar.accessory;
    return `
      <div class="avatar-stage ${stage}">
        <div class="avatar-accessory ${accessory}"></div>
        <div class="avatar-head"></div>
        <div class="avatar-eye left"></div>
        <div class="avatar-eye right"></div>
        <div class="avatar-body ${avatar.body}"></div>
        <div class="avatar-badge">${escapeHtml(avatar.badge)}</div>
      </div>
    `;
  }

  function renderAvatarShop(user, points) {
    const avatar = getAvatar(user, points);
    const slotNames = { body: '복장', accessory: '장식', stage: '배경', badge: '배지' };
    $('avatar-shop').innerHTML = Object.keys(avatarItems).map((slot) => `
      <section class="shop-group">
        <p class="shop-title">${slotNames[slot]}</p>
        <div class="shop-items">
          ${avatarItems[slot].map((item) => {
            const unlocked = points >= item.cost;
            const active = avatar[slot] === item.id;
            return `
              <button class="shop-item ${active ? 'active' : ''} ${unlocked ? '' : 'locked'}" type="button" data-slot="${slot}" data-item="${item.id}" ${unlocked ? '' : 'disabled'}>
                <strong>${escapeHtml(item.label)}</strong>
                <span>${active ? '장착 중' : unlocked ? '장착 가능' : item.cost + 'P 필요'}</span>
              </button>
            `;
          }).join('')}
        </div>
      </section>
    `).join('');

    $('avatar-shop').querySelectorAll('[data-slot]').forEach((button) => {
      button.addEventListener('click', () => {
        const current = getAvatar(user, points);
        current[button.dataset.slot] = button.dataset.item;
        avatarPrefs[user] = current;
        saveAvatarPrefs();
        renderRpg();
      });
    });
  }

  function getAvatar(user, points) {
    const saved = avatarPrefs[user] || {};
    const availablePoints = points === undefined ? Infinity : points;
    return {
      body: isUnlocked('body', saved.body, availablePoints) ? saved.body : 'starter',
      accessory: isUnlocked('accessory', saved.accessory, availablePoints) ? saved.accessory : 'none',
      stage: isUnlocked('stage', saved.stage, availablePoints) ? saved.stage : 'plain',
      badge: isUnlocked('badge', saved.badge, availablePoints) ? saved.badge : 'I'
    };
  }

  function isUnlocked(slot, id, points) {
    if (!id) return false;
    const item = avatarItems[slot].find((candidate) => candidate.id === id);
    return item ? points >= item.cost : false;
  }

  function calcUserProfile(user) {
    const list = records.filter((record) => record.user === user);
    const points = list.reduce((sum, record) => sum + recordPoints(record), 0);
    const doneTasks = list.reduce((sum, record) => sum + doneCount(record), 0);
    const successDays = new Set(list.filter((record) => doneCount(record) > 0).map((record) => localDateKey(record.createdAt))).size;
    return {
      points,
      doneTasks,
      successDays,
      level: Math.floor(points / 100) + 1,
      currentXp: points % 100
    };
  }

  function recordPoints(record) {
    const done = doneCount(record);
    const total = record.tasks.length;
    if (!done) return 0;
    let points = done * 10 + 15;
    if (done === total) points += 20;
    if (record.capacity && record.capacity.level === 'tiny') points += 10;
    return points;
  }

  function doneCount(record) {
    return record.tasks.filter((task) => task.done).length;
  }

  function renderNameHistory() {
    const el = $('name-history');
    if (!state.user) {
      el.innerHTML = '<div class="empty">이름을 확인하면 그 이름으로 저장된 과거 기록이 여기에 전부 표시됩니다.</div>';
      return;
    }

    const list = records
      .filter((record) => record.user === state.user)
      .slice()
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    if (!list.length) {
      el.innerHTML = '<div class="empty">아직 이 이름으로 저장된 기록이 없어요. 오늘 첫 기록을 만들면 여기에 남습니다.</div>';
      return;
    }

    el.innerHTML = `
      <div class="field-label">${escapeHtml(state.user)}님의 과거 기록 ${list.length}개</div>
      ${list.map((record) => {
        const done = record.tasks.filter((task) => task.done).length;
        const total = record.tasks.length;
        const info = levelText[record.capacity.level];
        const reward = recordPoints(record);
        return `
          <article class="name-record">
            <div>
              <div class="name-record-title">${info.label}</div>
              <div class="name-record-meta">${formatDate(record.createdAt)} · ${done}/${total}개 완료 · ${reward}P</div>
            </div>
            <button class="btn light" type="button" data-open-name-record="${record.id}">열기</button>
          </article>
        `;
      }).join('')}
    `;

    el.querySelectorAll('[data-open-name-record]').forEach((button) => {
      button.addEventListener('click', () => {
        const record = records.find((item) => item.id === button.dataset.openNameRecord);
        if (record) {
          renderResult(record, false);
          showPage('result');
        }
      });
    });
  }

  function calculateCapacity(values) {
    const positive = values.energy + values.mind + values.time;
    const score = positive - values.burden * 1.25;
    let level = 'tiny';
    let count = 1;

    if (score >= 21) {
      level = 'push';
      count = 5;
    } else if (score >= 14) {
      level = 'steady';
      count = 4;
    } else if (score >= 7) {
      level = 'light';
      count = 2;
    }

    if (values.energy <= 1 || values.mind <= 1 || values.time <= 1 || values.burden >= 9) {
      level = 'tiny';
      count = 1;
    }

    return { score: Math.round(score * 10) / 10, level, count };
  }

  function makePlan(event) {
    event.preventDefault();
    if (!state.user) {
      alert('이름을 먼저 확인해 주세요.');
      return;
    }

    const capacity = calculateCapacity(state.values);
    const tasks = buildTasks(capacity.count, state.focus);
    const record = {
      id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
      user: state.user,
      createdAt: new Date().toISOString(),
      values: { ...state.values },
      focus: state.focus,
      capacity,
      tasks
    };

    records.push(record);
    saveRecords();
    renderResult(record, true);
    renderRpg();
    renderNameHistory();
    renderHistory();
    renderStats();
    updateStreak();
    showPage('result');
  }

  function buildTasks(count, focus) {
    const exercise = linesFrom('exercise-template');
    const study = linesFrom('study-template');
    const tasks = [];
    let exerciseCount = 0;
    let studyCount = 0;

    if (count === 1) {
      if (focus === 'study') studyCount = 1;
      else exerciseCount = 1;
    } else if (focus === 'exercise') {
      exerciseCount = Math.ceil(count * .7);
      studyCount = count - exerciseCount;
    } else if (focus === 'study') {
      studyCount = Math.ceil(count * .7);
      exerciseCount = count - studyCount;
    } else {
      exerciseCount = Math.ceil(count / 2);
      studyCount = count - exerciseCount;
    }

    for (let i = 0; i < exerciseCount; i += 1) {
      tasks.push({ type: '운동', title: exercise[i % exercise.length], done: false });
    }
    for (let i = 0; i < studyCount; i += 1) {
      tasks.push({ type: '학습', title: study[i % study.length], done: false });
    }

    return tasks.slice(0, count);
  }

  function linesFrom(id) {
    const lines = $(id).value.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
    if (lines.length) return lines;
    return id === 'exercise-template' ? ['5분 산책'] : ['책 2쪽 읽기'];
  }

  function renderResult(record, justMade) {
    const info = levelText[record.capacity.level];
    const doneCount = record.tasks.filter((task) => task.done).length;
    const total = record.tasks.length;
    const percent = total ? Math.round(doneCount / total * 100) : 0;
    const reward = recordPoints(record);

    $('result-panel').innerHTML = `
      <div class="result-hero">
        <div>
          <p class="sub">${escapeHtml(record.user)} · ${formatDate(record.createdAt)}${justMade ? ' · 저장 완료' : ''}</p>
          <h2 class="level">${info.label}</h2>
          <p class="sub">${info.message}</p>
        </div>
        <div class="level-badge ${info.badge}">${record.capacity.count}개 계획</div>
      </div>

      <div class="score-strip">
        <div class="score"><span>몸 에너지</span><strong>${record.values.energy}</strong></div>
        <div class="score"><span>마음 여유</span><strong>${record.values.mind}</strong></div>
        <div class="score"><span>시간</span><strong>${record.values.time}</strong></div>
        <div class="score"><span>부담감</span><strong>${record.values.burden}</strong></div>
      </div>

      <div class="side-note" style="margin-bottom:12px;">
        완료율 ${percent}% · ${doneCount}/${total}개 완료 · 이번 기록 보상 ${reward}P. 최소 유지일에는 1개만 체크되어도 성공으로 기록됩니다.
      </div>

      <div class="plan-grid" id="task-list">
        ${record.tasks.map((task, index) => taskHtml(task, index)).join('')}
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        <button class="btn primary" type="button" id="save-progress">완료 상태 저장</button>
        <button class="btn light" type="button" id="new-plan">새 계획</button>
        <button class="btn light" type="button" id="go-history">이력 보기</button>
      </div>
    `;

    $('task-list').querySelectorAll('[data-task]').forEach((checkbox) => {
      checkbox.addEventListener('change', () => {
        const index = Number(checkbox.dataset.task);
        record.tasks[index].done = checkbox.checked;
        const item = checkbox.closest('.task');
        item.classList.toggle('done', checkbox.checked);
      });
    });

    $('save-progress').addEventListener('click', () => {
      const index = records.findIndex((item) => item.id === record.id);
      if (index >= 0) {
        records[index] = record;
        saveRecords();
        renderResult(record, false);
        renderRpg();
        renderNameHistory();
        renderHistory();
        renderStats();
        updateStreak();
      }
    });
    $('new-plan').addEventListener('click', resetForm);
    $('go-history').addEventListener('click', () => showPage('history'));
  }

  function taskHtml(task, index) {
    return `
      <label class="task ${task.done ? 'done' : ''}">
        <input type="checkbox" data-task="${index}" ${task.done ? 'checked' : ''} />
        <span>
          <p class="task-title">${escapeHtml(task.title)}</p>
          <span class="task-meta">${task.type}</span>
        </span>
      </label>
    `;
  }

  function showPage(page) {
    document.querySelectorAll('.tab').forEach((tab) => {
      tab.classList.toggle('active', tab.dataset.page === page);
    });
    document.querySelectorAll('.page').forEach((section) => section.classList.remove('active'));
    $(`page-${page}`).classList.add('active');
    if (page === 'history') renderHistory();
    if (page === 'stats') renderStats();
  }

  function users() {
    return [...new Set(records.map((record) => record.user))].sort((a, b) => a.localeCompare(b, 'ko'));
  }

  function renderChips(containerId, active, onPick) {
    const chipData = [{ key: 'all', label: '전체' }, ...users().map((user) => ({ key: user, label: user }))];
    $(containerId).innerHTML = chipData.map((chip) => `
      <button class="chip ${chip.key === active ? 'active' : ''}" type="button" data-filter="${escapeAttr(chip.key)}">${escapeHtml(chip.label)}</button>
    `).join('');
    $(containerId).querySelectorAll('button').forEach((button) => {
      button.addEventListener('click', () => onPick(button.dataset.filter));
    });
  }

  function filteredRecords(filter) {
    return records
      .filter((record) => filter === 'all' || record.user === filter)
      .slice()
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }

  function renderHistory() {
    renderChips('history-chips', historyFilter, (filter) => {
      historyFilter = filter;
      renderHistory();
    });

    const list = filteredRecords(historyFilter);
    if (!list.length) {
      $('history-list').innerHTML = '<div class="empty">아직 기록이 없어요. 오늘 계획을 만들면 여기에 남습니다.</div>';
      return;
    }

    $('history-list').innerHTML = list.map((record) => {
      const done = record.tasks.filter((task) => task.done).length;
      const total = record.tasks.length;
      const info = levelText[record.capacity.level];
      const reward = recordPoints(record);
      return `
        <article class="hist-item">
          <div>
            <div class="hist-title">${escapeHtml(record.user)} · ${info.label}</div>
            <time>${formatDate(record.createdAt)}</time>
            <div class="hist-meta">
              <span>계획 ${total}개</span>
              <span>완료 ${done}개</span>
              <span>완료율 ${total ? Math.round(done / total * 100) : 0}%</span>
              <span>${reward}P</span>
            </div>
          </div>
          <button class="btn light" type="button" data-open="${record.id}">열기</button>
        </article>
      `;
    }).join('');

    $('history-list').querySelectorAll('[data-open]').forEach((button) => {
      button.addEventListener('click', () => {
        const record = records.find((item) => item.id === button.dataset.open);
        if (record) {
          renderResult(record, false);
          showPage('result');
        }
      });
    });
  }

  function renderStats() {
    renderChips('stats-chips', statsFilter, (filter) => {
      statsFilter = filter;
      renderStats();
    });

    const list = filteredRecords(statsFilter).slice().reverse().slice(-14);
    if (!list.length) {
      $('stats-body').innerHTML = '<div class="empty">흐름을 볼 기록이 아직 없어요.</div>';
      return;
    }

    const totalPlans = list.reduce((sum, record) => sum + record.tasks.length, 0);
    const totalDone = list.reduce((sum, record) => sum + record.tasks.filter((task) => task.done).length, 0);
    const totalPoints = list.reduce((sum, record) => sum + recordPoints(record), 0);
    const avg = totalPlans ? Math.round(totalDone / totalPlans * 100) : 0;

    $('stats-body').innerHTML = `
      <div class="score-strip">
        <div class="score"><span>최근 기록</span><strong>${list.length}</strong></div>
        <div class="score"><span>계획 합계</span><strong>${totalPlans}</strong></div>
        <div class="score"><span>완료 합계</span><strong>${totalDone}</strong></div>
        <div class="score"><span>획득 포인트</span><strong>${totalPoints}P</strong></div>
      </div>
      <div class="side-note" style="margin-bottom:12px;">최근 평균 완료율 ${avg}% · 완료 1개당 10P, 하루 성공 15P, 전부 완료 20P가 더해집니다.</div>
      <div class="bar-list">
        ${list.map((record) => {
          const done = record.tasks.filter((task) => task.done).length;
          const total = record.tasks.length;
          const pct = total ? Math.round(done / total * 100) : 0;
          const points = recordPoints(record);
          return `
            <div class="bar-row">
              <span>${shortDate(record.createdAt)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
              <strong>${points}P</strong>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function updateStreak() {
    const days = [...new Set(records
      .filter((record) => record.tasks.some((task) => task.done))
      .map((record) => localDateKey(record.createdAt)))].sort().reverse();

    let streak = 0;
    const cursor = new Date();
    for (let i = 0; i < 365; i += 1) {
      const key = localDateKey(cursor.toISOString());
      if (days.includes(key)) {
        streak += 1;
        cursor.setDate(cursor.getDate() - 1);
      } else if (i === 0) {
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    $('streak-count').textContent = `${streak}일`;
  }

  function exportJson() {
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `consistency-records-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function clearHistory() {
    if (!records.length) return;
    if (!confirm('저장된 꾸준함 기록을 모두 삭제할까요?')) return;
    records = [];
    saveRecords();
    renderRpg();
    renderNameHistory();
    renderHistory();
    renderStats();
    updateStreak();
  }

  function formatDate(iso) {
    return new Intl.DateTimeFormat('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
  }

  function shortDate(iso) {
    const date = new Date(iso);
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }

  function localDateKey(iso) {
    const date = new Date(iso);
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, '&#96;');
  }

  init();
})();
</script>
</body>
</html>
