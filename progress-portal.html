<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>개발 진척 포털</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 바 + 탭, 최대 1180px 본문. 요약(숫자) → 할 일(확인 요청) → 세부(WBS·목록) 순서. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #18212c;
  --muted: #5c6776;
  --line: #dde2e8;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --stamp: #c4352b;
  --paper: #fffefb;
  --c1: #7d8796;
  --c2: #2f6fdb;
  --c3: #7a4fcf;
  --c4: #d27a1f;
  --c5: #2a9058;
  --c-reject: #cf3f35;
  --c-hold: #b88a00;
  --c-excl: #4a4f57;
  --shadow: 0 10px 30px rgba(24, 33, 44, .12);
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #19202a; --surface-2: #1f2733; --ink: #e5e9ef; --muted: #9ba6b5; --line: #2d3644;
    --accent: #6c9ff0; --accent-ink: #0d1520; --stamp: #e25a4f; --paper: #1c232d;
    --c1: #9aa4b2; --c2: #6c9ff0; --c3: #a787ec; --c4: #eb9a48; --c5: #4cbd7d; --c-reject: #ec6a60; --c-hold: #d9ae2c; --c-excl: #a3a9b2;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #19202a; --surface-2: #1f2733; --ink: #e5e9ef; --muted: #9ba6b5; --line: #2d3644;
  --accent: #6c9ff0; --accent-ink: #0d1520; --stamp: #e25a4f; --paper: #1c232d;
  --c1: #9aa4b2; --c2: #6c9ff0; --c3: #a787ec; --c4: #eb9a48; --c5: #4cbd7d; --c-reject: #ec6a60; --c-hold: #d9ae2c; --c-excl: #a3a9b2;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* 상단 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 260px; }
.brand b { font-size: 16px; }
.brand span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.role { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs .wrap { display: flex; gap: 2px; padding-block: 0; }
.tab { border: 0; background: none; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab .cnt { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--c4); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

main { padding-block: 22px 60px; }
.demo-note { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* 공통 */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--c-reject); border-color: color-mix(in srgb, var(--c-reject) 45%, var(--line)); }
.btn.ok { background: var(--c5); border-color: var(--c5); color: #fff; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.panel h2 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { font-size: 22px; }
.page-head p { margin: 4px 0 0; color: var(--muted); }

.pill { --c: var(--c1); display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.s1 { --c: var(--c1); } .s2 { --c: var(--c2); } .s3 { --c: var(--c3); } .s4 { --c: var(--c4); } .s5 { --c: var(--c5); }
.f-reject { --c: var(--c-reject); } .f-hold { --c: var(--c-hold); } .f-excl { --c: var(--c-excl); } .f-delay { --c: var(--c-reject); } .f-change { --c: var(--c3); }
.flag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); color: var(--c); margin-left: 4px; white-space: nowrap; }

.bar { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

/* 대시보드 */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 16px; }
.kpi .big { font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.kpi .big small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.kpi .bar { margin: 10px 0 8px; height: 10px; }
.kpi.todo .big { color: var(--c4); }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.stack > i { display: block; height: 100%; background: var(--c); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px 12px; margin-top: 12px; }
.legend div { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.legend div span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { --c: var(--c1); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
.chip b { color: var(--c); font-size: 15px; }
.todo-list { display: grid; gap: 8px; }
.todo-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
.todo-item .t { flex: 1 1 200px; min-width: 0; }
.todo-item .t b { display: block; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.phase-row { display: grid; grid-template-columns: minmax(110px, 160px) 1fr 54px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.phase-row:first-of-type { border-top: 0; }
.chart svg { width: 100%; height: auto; display: block; }

/* 표 */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em; white-space: nowrap; background: var(--surface-2); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters select, .filters input, .field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.filters input { flex: 1 1 180px; }

/* WBS */
.wbs td { padding: 7px 10px; }
.wbs .lv0 td { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); font-weight: 600; }
.wbs .lv1 td { background: var(--surface-2); font-weight: 600; }
.wbs .lv1 td:first-child { padding-left: 22px; }
.wbs .lv2 td:first-child { padding-left: 38px; }
.gantt { position: relative; height: 14px; min-width: 260px; }
.gantt .g { position: absolute; top: 2px; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--c) 30%, transparent); border: 1px solid var(--c); }
.gantt .today { position: absolute; top: -9px; bottom: -9px; width: 0; border-left: 1.5px dashed var(--c-reject); }
.gantt .ms { position: absolute; top: 1px; width: 10px; height: 10px; transform: rotate(45deg); background: var(--accent); margin-left: -5px; }
.gantt-head { position: relative; height: 16px; font-size: 11px; color: var(--muted); min-width: 260px; }
.gantt-head span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

/* 드로어 / 모달 */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(560px, 100%); height: 100%; background: var(--surface); box-shadow: var(--shadow); overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px; }
.drawer h2 { font-size: 19px; margin: 6px 0 10px; }
.drawer section { margin-top: 20px; }
.drawer section h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; letter-spacing: .02em; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.criteria { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.criteria li { display: flex; gap: 8px; align-items: flex-start; }
.criteria li i { flex: none; width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 12px; margin-top: 1px; }
.criteria li.pass i { background: var(--c5); border-color: var(--c5); color: #fff; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 12px; }
.timeline li { position: relative; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--c1)); border: 2px solid var(--surface); }
.timeline .when { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.callout { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 8%, var(--surface)); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.modal-scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); z-index: 30; display: grid; place-items: center; padding: 16px; }
.modal { width: min(440px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; }
.modal h3 { font-size: 17px; margin-bottom: 8px; }
.field { display: grid; gap: 5px; margin-top: 12px; }
.field label { font-size: 12.5px; color: var(--muted); }
.field textarea { min-height: 80px; resize: vertical; }
.otp { font-family: var(--f-mono); font-size: 22px; letter-spacing: .3em; text-align: center; }
.error { color: var(--c-reject); font-size: 12.5px; margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 40; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* 로그인 */
.login { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; }
.login-card { width: min(460px, 100%); }
.login-card h1 { font-size: 24px; margin-bottom: 6px; }
.keyinput { width: 100%; font-family: var(--f-mono); font-size: 18px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.demo-keys { margin-top: 22px; display: grid; gap: 6px; }
.demo-keys button { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; flex-wrap: wrap; }
.demo-keys button:hover { border-color: var(--accent); }

/* 확인서 */
.paper { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: clamp(20px, 5vw, 48px); max-width: 820px; margin: 0 auto; }
.paper .doc-no { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.paper h1 { text-align: center; font-size: 26px; letter-spacing: .5em; margin: 26px 0 28px; padding-left: .5em; }
.paper .meta { width: 100%; margin-bottom: 18px; }
.paper .meta th { width: 120px; background: var(--surface-2); }
.paper table { font-size: 12.5px; }
.paper .stmt { margin: 22px 0; line-height: 1.8; }
.signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 28px; }
.sign { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-height: 120px; position: relative; }
.sign .lbl { font-size: 12px; color: var(--muted); }
.sign .nm { margin-top: 6px; font-weight: 600; }
.sign .at { font-size: 12px; color: var(--muted); }
.stampmark { position: absolute; right: 16px; top: 26px; width: 66px; height: 66px; border-radius: 50%; border: 2.5px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 13px; line-height: 1.15; transform: rotate(-12deg); opacity: .9; }
.stampmark.wait { border-style: dashed; color: var(--muted); border-color: var(--line); transform: none; font-weight: 500; font-size: 12px; }
.cert-list .row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.cert-list .row:first-child { border-top: 0; }
.cert-list .row .t { flex: 1 1 240px; min-width: 0; }

/* 관리자 */
.proj-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.newkey { font-family: var(--f-mono); font-size: 20px; letter-spacing: .06em; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; text-align: center; margin: 10px 0; word-break: break-all; }

@media (max-width: 560px) {
  .page-head h1 { font-size: 19px; }
  .kpi .big { font-size: 34px; }
  .kv { grid-template-columns: 80px 1fr; }
  .phase-row { grid-template-columns: 1fr 48px; }
  .phase-row .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

}

  var ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = [];

}

  var inc = list.filter(included), tot = 0, w = 0;

    copy: function (t) {
      var self = this;
      try { navigator.clipboard.writeText(t).then(function () { self.toast('복사했습니다'); }, function () { self.toast('복사가 막혀 있습니다. 직접 선택해 복사해 주세요'); }); }
      catch (e) { this.toast('복사가 막혀 있습니다. 직접 선택해 복사해 주세요'); }
    },
    projName: function (id) { var p = this.state.projects.find(function (x) { return x.id === id; }); return p ? p.company + ' · ' + p.name : '전체'; },
    certScopeName: function (c) {
      var p = this.state.projects.find(function (x) { return x.id === c.project; });
      if (c.type === 'func') { var a = p.areas.find(function (x) { return x.code === c.scope; }); return a.name + ' 영역 (' + a.code + ')'; }
      var ph = p.phases.find(function (x) { return x.id === c.scope; }); return ph.name + ' 단계';
    },
    certFeatures: function (c) {
      var p = this.state.projects.find(function (x) { return x.id === c.project; });
      return c.features.map(function (id) { return p.features.find(function (f) { return f.id === id; }); }).filter(Boolean);
    },
    confirmInfo: function (f) {
      var h = f.history.slice().reverse().find(function (x) { return x.stage === 5; });
      return h ? h : { at: '-', who: '-' };
    },
    accSummary: function (c) {
      var p = this.state.projects.find(function (x) { return x.id === c.project; });
      var all = p.features.filter(function (f) { return f.phase === c.scope; });
      var funcNos = this.state.certs.filter(function (x) { return x.type === 'func' && x.status === '서명완료' && x.features.some(function (id) { return c.features.indexOf(id) >= 0; }); }).map(function (x) { return x.no; });
      return {
        total: all.length,
        base: all.filter(function (f) { return !f.change; }).length,
        added: all.filter(function (f) { return f.change && !f.excluded; }).length,
        excluded: all.filter(function (f) { return f.excluded; }).length,
        rate: doneRate(all), funcNos: funcNos
      };
    },
    viewProjectAsClient: function (id) { this.viewAs = id; this.tab = 'dash'; window.scrollTo(0, 0); },
    exitViewAs: function () { this.viewAs = null; this.tab = 'overview'; }
  },
  template: '#tpl'
};

window.addEventListener('DOMContentLoaded', function () {
  Vue.createApp(App).mount('#app');
});
})();
</script>

<script type="text/x-template" id="tpl">
<!-- 로그인 -->
<div v-if="!session" class="login">
  <div class="login-card panel">

        <span><b>{{ k.name }}</b> <span class="muted small">· {{ k.role === '관리자' ? '우리 회사 관리자' : projName(k.project).split(' · ')[0] + ' ' + k.role }}</span></span>
        <span class="mono small muted">{{ k.key }}</span>
      </button>
    </div>
  </div>
</div>

<template v-else>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <b>개발 진척 포털</b>
      <span v-if="clientMode">{{ project.company }} · {{ project.name }}</span>
      <span v-else>관리자</span>
    </div>
    <div class="who">
      <span>{{ session.name }}</span><span class="role">{{ session.role }}</span>
      <button class="btn sm" @click="logout">로그아웃</button>
    </div>
  </div>
  <nav class="tabs" aria-label="메뉴">
    <div class="wrap">
      <template v-if="clientMode">
        <button class="tab" :class="{on: tab==='dash'}" @click="go('dash')">대시보드<span v-if="myTodoCount" class="cnt">{{ myTodoCount }}</span></button>
        <button class="tab" :class="{on: tab==='wbs'}" @click="go('wbs')">WBS</button>
        <button class="tab" :class="{on: tab==='list'}" @click="go('list')">기능 목록</button>
        <button class="tab" :class="{on: tab==='certs'}" @click="go('certs')">확인서<span v-if="pendingSign" class="cnt">{{ pendingSign }}</span></button>
      </template>
      <template v-else>
        <button class="tab" :class="{on: tab==='overview'}" @click="go('overview')">전체 현황</button>
        <button class="tab" :class="{on: tab==='github'}" @click="go('github')">기능 상태 (GitHub)</button>
        <button class="tab" :class="{on: tab==='issue'}" @click="go('issue')">확인서 발행</button>
        <button class="tab" :class="{on: tab==='keys'}" @click="go('keys')">접속키 관리</button>
      </template>
    </div>
  </nav>
</header>

<main class="wrap">
  <div class="demo-note">
    <span>시제품입니다. 모든 회사·사람·기능은 예시 데이터이며 기준일은 {{ today }}입니다. 처리 내용은 이 브라우저에만 저장됩니다.</span>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button v-if="isAdmin && viewAs" class="btn sm" @click="exitViewAs">관리자 화면으로</button>
      <button class="btn sm" @click="resetDemo">시연 데이터 초기화</button>
    </span>
  </div>

  <!-- ===== 고객: 대시보드 ===== -->
  <section v-if="clientMode && tab==='dash'">
    <div class="page-head">
      <div>
        <h1>{{ project.name }}</h1>
        <p>{{ project.company }} · 기간 {{ project.start }} ~ {{ project.end }} · <span v-for="(ph, i) in project.phases" :key="ph.id">{{ i ? ', ' : '' }}{{ ph.name }} {{ md(ph.due) }}</span></p>
      </div>
    </div>

    <div class="kpis">
      <div class="panel kpi">
        <div class="muted small">진척률 (공수 가중)</div>
        <div class="big num">{{ progress }}<small>%</small></div>
        <div class="bar"><i :style="{width: progress + '%'}"></i></div>
        <div class="small muted">단계 가중치 대기 0 · 개발중 30 · 테스트중 60 · 확인 요청 80 · 완료 100</div>
      </div>
      <div class="panel kpi">
        <div class="muted small">완료율 (고객 확인 기준)</div>
        <div class="big num">{{ done }}<small>%</small></div>
        <div class="bar"><i :style="{width: done + '%', background: 'var(--c5)'}"></i></div>
        <div class="small muted num">전체 {{ incCount }}건 중 {{ doneCount }}건 확인 완료 (제외 {{ flagCounts.excl }}건 빼고)</div>
      </div>
      <div class="panel kpi todo">
        <div class="muted small">확인 요청 (고객 검수 대기)</div>
        <div class="big num">{{ toConfirm.length }}<small>건</small></div>
        <div class="small muted" style="margin-top:10px">{{ can.confirm ? '아래 목록에서 기능을 열어 확인하거나 반려해 주세요.' : '조회 권한이라 확인·반려는 담당자가 합니다.' }}</div>
      </div>
    </div>

    <div class="grid g-2">
      <div class="panel">
        <h2>확인 요청 <small>내부 테스트를 통과한 기능</small></h2>
        <div v-if="toConfirm.length" class="todo-list">
          <div v-for="f in toConfirm" :key="f.id" class="todo-item">
            <span class="mono small muted">{{ f.id }}</span>
            <div class="t"><b>{{ f.title }}</b><span class="small muted">{{ areaName(f.area) }} · 예정 {{ f.due }}<span v-if="f.rejects"> · 반려 {{ f.rejects }}회 후 재요청</span></span></div>
            <button class="btn sm" :class="{primary: can.confirm}" @click="openFeature(f)">{{ can.confirm ? '검수하기' : '보기' }}</button>
          </div>
        </div>
        <div v-else class="empty">지금 확인할 기능이 없습니다.</div>
      </div>

      <div class="panel">
        <h2>단계별 기능 수 <small class="num">{{ incCount }}건</small></h2>
        <div class="stack">
          <i v-for="c in stageCounts" :key="c.s.n" :class="'s' + c.s.n" :style="{width: (c.n / incCount * 100) + '%'}" :title="c.s.client + ' ' + c.n + '건'"></i>
        </div>
        <div class="legend">
          <div v-for="c in stageCounts" :key="c.s.n" :class="'s' + c.s.n"><span>{{ c.s.client }}</span><b class="num">{{ c.n }}</b></div>
        </div>
        <div class="chips">
          <button class="chip f-delay" style="background:none" @click="filter.status='delay'; go('list')"><span>일정 지연</span><b class="num">{{ flagCounts.delay }}</b></button>
          <button class="chip f-hold" style="background:none" @click="filter.status='hold'; go('list')"><span>보류</span><b class="num">{{ flagCounts.hold }}</b></button>
          <div class="chip f-reject"><span>재작업 중</span><b class="num">{{ flagCounts.reject }}</b></div>
          <div class="chip f-change"><span>변경요청</span><b class="num">{{ flagCounts.change }}</b></div>
        </div>
      </div>

      <div class="panel chart">
        <h2>주간 진척률 추이 <small>매주 월요일 기준, 마지막 점은 오늘</small></h2>
        <svg :viewBox="'0 0 ' + trendSvg.W + ' ' + trendSvg.H" role="img" :aria-label="'진척률이 ' + trendPoints[0][1] + '%에서 ' + progress + '%로 올랐습니다'">
          <g v-for="g in trendSvg.grid" :key="g.v">
            <line :x1="trendSvg.L" :x2="trendSvg.R" :y1="g.y" :y2="g.y" stroke="var(--line)" stroke-width="1"></line>
            <text :x="trendSvg.L - 8" :y="g.y + 4" text-anchor="end" font-size="11" fill="var(--muted)">{{ g.v }}</text>
          </g>
          <path :d="trendSvg.area" fill="var(--accent)" fill-opacity="0.1"></path>
          <path :d="trendSvg.line" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round"></path>
          <g v-for="l in trendSvg.labels" :key="l.t + l.x">
            <circle :cx="l.x" :cy="l.y" :r="l.last ? 5 : 3" :fill="l.last ? 'var(--accent)' : 'var(--surface)'" stroke="var(--accent)" stroke-width="2"></circle>
            <text :x="l.x" :y="trendSvg.base + 18" text-anchor="middle" font-size="11" :fill="l.last ? 'var(--ink)' : 'var(--muted)'" :font-weight="l.last ? 600 : 400">{{ l.t }}</text>
          </g>
          <text v-for="l in trendSvg.labels.filter(x => x.last)" :key="'v' + l.x" :x="l.x - 10" :y="l.y - 10" text-anchor="end" font-size="13" font-weight="600" fill="var(--ink)">{{ l.v }}%</text>
        </svg>
      </div>

      <div class="panel">
        <h2>단계(마일스톤)별 진척</h2>
        <div v-for="s in phaseStats" :key="s.ph.id" class="phase-row">
          <div><b>{{ s.ph.name }}</b><div class="small muted num">~{{ s.ph.due }} · 완료 {{ s.d }}/{{ s.n }}</div></div>
          <div class="bar"><i :style="{width: s.p + '%'}"></i></div>
          <b class="num" style="text-align:right">{{ s.p }}%</b>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 고객: WBS ===== -->
  <section v-if="clientMode && tab==='wbs'">
    <div class="page-head"><div><h1>WBS</h1><p>단계 › 업무 영역 › 기능. 막대는 예정 작업 기간, 빨간 점선은 오늘입니다.</p></div></div>
    <div class="panel tablewrap" style="padding:0">
      <table class="wbs">
        <thead><tr><th>항목</th><th>상태</th><th>예정 완료</th><th style="text-align:right">진척</th><th style="min-width:280px"><div class="gantt-head"><span v-for="t in ganttTicks" :key="t.t" :style="{left: t.left + '%'}">{{ t.t }}</span></div></th></tr></thead>
        <tbody>
          <tr v-for="r in wbs" :key="r.key" :class="['lv' + r.lv, {click: r.lv===2}]" @click="r.lv===2 && openFeature(r.f)">
            <td>
              <template v-if="r.lv===2"><span class="mono small muted">{{ r.f.id }}</span> {{ r.f.title }}
                <span v-if="r.f.change" class="flag f-change">변경요청</span></template>
              <template v-else>{{ r.name }}</template>
            </td>
            <td><template v-if="r.lv===2"><span class="pill" :class="pillClass(r.f)">{{ stageName(r.f) }}</span><span v-if="r.f.hold && !r.f.excluded" class="flag f-hold">보류</span><span v-if="delayed(r.f)" class="flag f-delay">지연</span></template></td>
            <td class="num small">{{ r.lv===2 ? r.f.due : r.due }}</td>
            <td class="num" style="text-align:right">{{ r.p === null ? '—' : r.p + '%' }}</td>
            <td>
              <div class="gantt">
                <div class="today" :style="{left: todayLeft + '%'}"></div>
                <div v-if="r.lv===2 && !r.f.excluded" class="g" :class="pillClass(r.f)" :style="{left: gantt(r.f).left + '%', width: gantt(r.f).width + '%'}"></div>
                <div v-if="r.lv===0" class="ms" :style="{left: msLeft(r.ms) + '%'}" :title="r.name + ' ' + r.ms"></div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- ===== 고객: 기능 목록 ===== -->
  <section v-if="clientMode && tab==='list'">
    <div class="page-head"><div><h1>기능 목록</h1><p>행을 누르면 기능 설명, 수용 기준, 처리 이력을 볼 수 있습니다.</p></div></div>
    <div class="filters">
      <input id="q" v-model="filter.q" placeholder="기능 ID 또는 이름 검색" aria-label="검색">
      <select id="fs" v-model="filter.status" aria-label="상태">
        <option value="">상태 전체</option>
        <option v-for="s in stages" :key="s.n" :value="String(s.n)">{{ s.client }}</option>
        <option value="delay">일정 지연</option><option value="hold">보류</option><option value="x">제외</option>
      </select>
      <select id="fa" v-model="filter.area" aria-label="영역"><option value="">영역 전체</option><option v-for="a in project.areas" :key="a.code" :value="a.code">{{ a.name }}</option></select>
      <select id="fp" v-model="filter.phase" aria-label="단계"><option value="">단계 전체</option><option v-for="p in project.phases" :key="p.id" :value="p.id">{{ p.name }}</option></select>
    </div>
    <div class="panel tablewrap" style="padding:0">
      <table>
        <thead><tr><th>기능 ID</th><th>기능명</th><th>영역</th><th>단계</th><th>우선순위</th><th>상태</th><th>예정 완료</th></tr></thead>
        <tbody>
          <tr v-for="f in filtered" :key="f.id" class="click" @click="openFeature(f)">
            <td class="mono small">{{ f.id }}</td>
            <td>{{ f.title }}<span v-if="f.change" class="flag f-change">변경요청</span></td>
            <td>{{ areaName(f.area) }}</td><td>{{ phaseName(f.phase) }}</td><td>{{ f.priority }}</td>
            <td><span class="pill" :class="pillClass(f)">{{ stageName(f) }}</span><span v-if="f.hold && !f.excluded" class="flag f-hold">보류</span><span v-if="f.rejects && f.status<5" class="flag f-reject">재작업</span><span v-if="delayed(f)" class="flag f-delay">지연</span></td>
            <td class="num small">{{ f.due }}</td>
          </tr>
          <tr v-if="!filtered.length"><td colspan="7" class="muted" style="text-align:center;padding:24px">조건에 맞는 기능이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- ===== 고객: 확인서 ===== -->
  <section v-if="clientMode && tab==='certs' && !certOpen">
    <div class="page-head"><div><h1>확인서</h1><p>기능 구현 확인서는 업무 영역이 끝날 때마다, 인수 확인서는 단계가 끝날 때 발행됩니다.</p></div></div>
    <div class="panel cert-list">
      <div v-for="c in certs" :key="c.no" class="row">
        <span class="pill" :class="c.status==='서명완료' ? 's5' : c.status==='반려' ? 'f-reject' : 's4'">{{ c.status }}</span>
        <div class="t"><b>{{ c.type==='func' ? '기능 구현 확인서' : '인수 확인서' }}</b> · {{ certScopeName(c) }}<div class="small muted mono">{{ c.no }} · 기능 {{ c.features.length }}건</div></div>
        <button class="btn sm" :class="{primary: c.status==='서명대기' && can.sign}" @click="certOpen = c.no">{{ c.status==='서명대기' && can.sign ? '검토·서명' : '열기' }}</button>
      </div>
      <div v-if="!certs.length" class="empty">아직 발행된 확인서가 없습니다.</div>
    </div>
  </section>

  <section v-if="(clientMode && tab==='certs' || !clientMode && tab==='issue') && certOpen">
    <template v-for="c in state.certs.filter(x => x.no === certOpen)" :key="c.no">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn sm" @click="certOpen = null">← 목록으로</button>
        <div v-if="clientMode && c.status==='서명대기'" style="display:flex;gap:8px;flex-wrap:wrap">
          <template v-if="can.sign">
            <button class="btn danger sm" @click="askOtp('certReturn', c)">되돌리기</button>
            <button class="btn primary sm" @click="askOtp('sign', c)">확인하고 서명</button>
          </template>
          <span v-else class="small muted">서명은 고객 책임자만 할 수 있습니다.</span>
        </div>
      </div>
      <div v-if="c.status==='반려'" class="callout f-reject" style="margin-bottom:14px">고객이 되돌린 문서입니다. 사유: {{ c.returnReason }}</div>
      <article class="paper">
        <div class="doc-no"><span>문서번호 {{ c.no }}</span><span>{{ c.status==='서명완료' ? '서명 완료 · 수정 불가' : c.status }}</span></div>
        <h1>{{ c.type==='func' ? '기능 구현 확인서' : '인수 확인서' }}</h1>
        <table class="meta">
          <tbody>
            <tr><th>프로젝트</th><td>{{ projName(c.project).split(' · ')[1] }}</td></tr>
            <tr><th>발주사</th><td>{{ projName(c.project).split(' · ')[0] }}</td></tr>
            <tr><th>수행사</th><td>(우리 회사명)</td></tr>
            <tr><th>확인 범위</th><td>{{ certScopeName(c) }} · 기능 {{ c.features.length }}건</td></tr>
          </tbody>
        </table>

        <template v-if="c.type==='func'">
          <div class="tablewrap">
          <table>
            <thead><tr><th>기능 ID</th><th>기능명</th><th>수용 기준</th><th>고객 확인</th><th>반려</th></tr></thead>
            <tbody>
              <tr v-for="f in certFeatures(c)" :key="f.id">
                <td class="mono">{{ f.id }}</td><td>{{ f.title }}</td><td class="num">{{ f.criteria.length }}건 통과</td>
                <td class="small">{{ confirmInfo(f).at }}<br><span class="muted">{{ confirmInfo(f).who }}</span></td>
                <td class="num">{{ f.rejects ? f.rejects + '회' : '-' }}</td>
              </tr>
            </tbody>
          </table>
          </div>
          <p class="stmt">위 기능이 각 기능의 수용 기준에 따라 구현되었고, 발주사 담당자의 확인을 거쳤음을 확인합니다.</p>
        </template>

        <template v-else>
          <table class="meta">
            <tbody>
              <tr><th>최초 범위</th><td class="num">{{ accSummary(c).base }}건</td></tr>
              <tr><th>추가(변경요청)</th><td class="num">{{ accSummary(c).added }}건</td></tr>
              <tr><th>범위 제외</th><td class="num">{{ accSummary(c).excluded }}건</td></tr>
              <tr><th>최종 완료율</th><td class="num">{{ accSummary(c).rate }}%</td></tr>
              <tr><th>근거 확인서</th><td class="mono small">{{ accSummary(c).funcNos.join(', ') || '-' }}</td></tr>
              <tr><th>하자보수</th><td>인수일로부터 12개월 (계약서 기준)</td></tr>
            </tbody>
          </table>
          <p class="stmt">위 범위의 개발 결과물을 검수하였으며, 이상 없이 인수하였음을 확인합니다.</p>
        </template>

        <div class="signs">
          <div class="sign">
            <div class="lbl">수행사</div>
            <div class="nm">{{ c.vendorSign ? c.vendorSign.name : '-' }}</div>
            <div class="at">{{ c.vendorSign ? c.vendorSign.at : '' }}</div>
            <div class="stampmark" :class="{wait: !c.vendorSign}">{{ c.vendorSign ? '확인' : '대기' }}</div>
          </div>
          <div class="sign">
            <div class="lbl">발주사 책임자</div>
            <div class="nm">{{ c.clientSign ? c.clientSign.name : '서명 대기' }}</div>
            <div class="at">{{ c.clientSign ? c.clientSign.at + ' · 이메일 인증' : '' }}</div>
            <div class="stampmark" :class="{wait: !c.clientSign}">{{ c.clientSign ? '확인' : '서명 전' }}</div>
          </div>
        </div>
      </article>
      <p class="small muted" style="text-align:center;margin-top:12px">실제 서비스에서는 양측 서명 후 PDF로 고정 보관하고 내려받을 수 있습니다.</p>
    </template>
  </section>

  <!-- ===== 관리자: 전체 현황 ===== -->
  <section v-if="!clientMode && tab==='overview'">
    <div class="page-head"><div><h1>전체 현황</h1><p>모든 고객사 프로젝트를 한눈에 봅니다. 고객 화면 보기로 고객이 보는 화면을 그대로 확인할 수 있습니다.</p></div></div>
    <div class="proj-cards">
      <div v-for="o in adminOverview" :key="o.p.id" class="panel">
        <div class="small muted">{{ o.p.company }}</div>
        <h2 style="margin:2px 0 12px">{{ o.p.name }}</h2>
        <div class="phase-row" style="border:0;padding-top:0"><span class="small">진척률</span><div class="bar"><i :style="{width: o.prog + '%'}"></i></div><b class="num" style="text-align:right">{{ o.prog }}%</b></div>
        <div class="phase-row" style="border:0;padding-top:0"><span class="small">완료율</span><div class="bar"><i :style="{width: o.done + '%', background: 'var(--c5)'}"></i></div><b class="num" style="text-align:right">{{ o.done }}%</b></div>
        <div class="chips">
          <div class="chip s4"><span>확인 대기</span><b class="num">{{ o.wait }}</b></div>
          <div class="chip f-delay"><span>지연</span><b class="num">{{ o.delay }}</b></div>
          <div class="chip f-hold"><span>보류</span><b class="num">{{ o.hold }}</b></div>
          <div class="chip f-reject"><span>누적 반려</span><b class="num">{{ o.rejects }}</b></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
          <button class="btn sm primary" @click="viewProjectAsClient(o.p.id)">고객 화면 보기</button>
          <button class="btn sm" @click="adminProject = o.p.id; go('github')">기능 상태</button>
        </div>
        <div class="small muted mono" style="margin-top:10px">{{ o.p.repo }}</div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>최근 처리 기록 <small>접속·확인·반려·서명</small></h2>
      <div class="tablewrap"><table><thead><tr><th>일시</th><th>누가</th><th>무엇을</th></tr></thead>
        <tbody><tr v-for="(l, i) in state.logs.slice(0, 12)" :key="i"><td class="num small">{{ l.at }}</td><td>{{ l.who }}</td><td>{{ l.what }}</td></tr></tbody></table></div>
    </div>
  </section>

  <!-- ===== 관리자: 기능 상태 (GitHub 시뮬레이션) ===== -->
  <section v-if="!clientMode && tab==='github'">
    <div class="page-head">
      <div><h1>기능 상태</h1><p>실제 운영에서는 GitHub 이슈의 라벨이 바뀌면 자동 반영됩니다. 시제품에서는 여기서 라벨 변경을 흉내 냅니다. 완료는 고객의 확인으로만 바뀝니다.</p></div>
      <select id="ap" v-model="adminProject" aria-label="프로젝트" class="btn"><option v-for="p in state.projects" :key="p.id" :value="p.id">{{ p.company }} · {{ p.name }}</option></select>
    </div>
    <div class="panel tablewrap" style="padding:0">
      <table>
        <thead><tr><th>이슈</th><th>기능</th><th>담당 (내부)</th><th>공수</th><th>GitHub 라벨</th><th>표시</th><th>처리</th></tr></thead>
        <tbody>
          <tr v-for="f in feats" :key="f.id">
            <td class="mono small">#{{ f.issue }}</td>
            <td><span class="mono small muted">{{ f.id }}</span> <button class="linkbtn" @click="openFeature(f)">{{ f.title }}</button></td>
            <td>{{ f.assignee || '-' }}</td>
            <td class="num">{{ f.effort }}일</td>
            <td>
              <span v-if="f.excluded" class="pill f-excl">제외</span>
              <span v-else-if="f.status===5" class="pill s5">상태:5-완료</span>
              <select v-else :id="'st-' + f.id" :value="f.status" @change="setStage(f, $event.target.value)" class="btn sm" :aria-label="f.id + ' 라벨'">
                <option v-for="s in stages.slice(0, 4)" :key="s.n" :value="s.n">{{ s.github }}</option>
              </select>
            </td>
            <td><span v-if="f.hold" class="flag f-hold">보류</span><span v-if="f.rejects" class="flag f-reject">반려 {{ f.rejects }}</span><span v-if="f.change" class="flag f-change">변경요청</span><span v-if="delayed(f)" class="flag f-delay">지연</span></td>
            <td style="white-space:nowrap">
              <button v-if="f.status===3 && !f.excluded" class="btn sm danger" @click="failTest(f)">테스트 실패</button>
              <button v-if="f.status<5 && !f.excluded" class="btn sm" @click="toggleHold(f)">{{ f.hold ? '보류 해제' : '보류' }}</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- ===== 관리자: 확인서 발행 ===== -->
  <section v-if="!clientMode && tab==='issue' && !certOpen">
    <div class="page-head">
      <div><h1>확인서 발행</h1><p>조건을 채운 범위만 발행할 수 있습니다. 발행하면 수행사 서명이 들어가고 고객 책임자에게 서명 요청이 갑니다.</p></div>
      <select id="ap2" v-model="adminProject" aria-label="프로젝트" class="btn"><option v-for="p in state.projects" :key="p.id" :value="p.id">{{ p.company }} · {{ p.name }}</option></select>
    </div>
    <div class="grid g-2">
      <div class="panel cert-list">
        <h2>기능 구현 확인서 <small>업무 영역 단위 · 포함 기능 전부 완료</small></h2>
        <div v-for="c in funcCandidates" :key="c.a.code" class="row">
          <div class="t"><b>{{ c.a.name }}</b> <span class="mono small muted">{{ c.a.code }}</span><div class="small muted">기능 {{ c.n }}건 · {{ c.issued ? c.issued.no + ' ' + c.issued.status : c.notDone ? '미완료 ' + c.notDone + '건' : '발행 가능' }}</div></div>
          <button v-if="c.issued" class="btn sm" @click="certOpen = c.issued.no">열기</button>
          <button v-else class="btn sm primary" :disabled="!c.ok" @click="issueFunc(c)">발행</button>
        </div>
      </div>
      <div class="panel cert-list">
        <h2>인수 확인서 <small>단계 단위 · 기능확인서 전부 서명 + 보류 0건</small></h2>
        <div v-for="c in accCandidates" :key="c.ph.id" class="row">
          <div class="t"><b>{{ c.ph.name }}</b> <span class="small muted">~{{ c.ph.due }}</span><div class="small muted">기능 {{ c.n }}건 · {{ c.issued ? c.issued.no + ' ' + c.issued.status : c.reason || '발행 가능' }}</div></div>
          <button v-if="c.issued" class="btn sm" @click="certOpen = c.issued.no">열기</button>
          <button v-else class="btn sm primary" :disabled="!c.ok" @click="issueAcc(c)">발행</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 관리자: 접속키 ===== -->
  <section v-if="!clientMode && tab==='keys'">
    <div class="page-head"><div><h1>접속키 관리</h1><p>고객사 담당자마다 따로 발급합니다. 키는 발급할 때 한 번만 보여 주고, 서버에는 암호화해서 저장합니다.</p></div></div>
    <div class="grid g-2" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))">
      <div class="panel">
        <h2>새 접속키 발급</h2>
        <form @submit.prevent="issueKey">
          <div class="field"><label for="nk-p">프로젝트</label><select id="nk-p" v-model="newKey.project"><option v-for="p in state.projects" :key="p.id" :value="p.id">{{ p.company }} · {{ p.name }}</option></select></div>
          <div class="field"><label for="nk-n">담당자 이름</label><input id="nk-n" v-model="newKey.name" placeholder="홍길동"></div>
          <div class="field"><label for="nk-e">이메일 (인증번호를 받을 주소)</label><input id="nk-e" v-model="newKey.email" placeholder="name@company.example"></div>
          <div class="field"><label for="nk-r">역할</label><select id="nk-r" v-model="newKey.role"><option>조회자</option><option>담당자</option><option>책임자</option></select></div>
          <button class="btn primary" style="margin-top:14px">발급</button>
        </form>
        <div v-if="issuedKey" class="callout s5" style="margin-top:14px">
          발급했습니다. 이 화면을 닫으면 다시 볼 수 없습니다.
          <div class="newkey">{{ issuedKey }}</div>
          <button class="btn sm" @click="copy(issuedKey)">복사</button>
        </div>
      </div>
      <div class="panel tablewrap" style="padding:0">
        <table>
          <thead><tr><th>이름</th><th>회사</th><th>역할</th><th>최근 접속</th><th>상태</th><th></th></tr></thead>
          <tbody>
            <tr v-for="k in state.keys.filter(x => x.role !== '관리자')" :key="k.key">
              <td>{{ k.name }}<div class="small muted">{{ maskEmail(k.email) }}</div></td>
              <td>{{ projName(k.project).split(' · ')[0] }}</td>
              <td>{{ k.role }}</td>
              <td class="num small">{{ k.last }}</td>
              <td><span class="pill" :class="k.status==='사용' ? 's5' : 'f-excl'">{{ k.status }}</span></td>
              <td><button v-if="k.status==='사용'" class="btn sm danger" @click="revokeKey(k)">폐기</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<!-- 기능 상세 드로어 -->
<div v-if="drawer" class="scrim" @click.self="drawer = null">
  <aside class="drawer" role="dialog" aria-modal="true" :aria-label="drawer + ' 상세'">
    <template v-for="f in feats.filter(x => x.id === drawer)" :key="f.id">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span class="mono small muted">{{ f.id }}<template v-if="!clientMode"> · GitHub #{{ f.issue }}</template></span>
        <button class="btn sm" @click="drawer = null">닫기</button>
      </div>
      <h2>{{ f.title }}</h2>
      <div><span class="pill" :class="pillClass(f)">{{ stageName(f) }}</span><span v-if="f.hold && !f.excluded" class="flag f-hold">보류</span><span v-if="f.rejects && f.status<5" class="flag f-reject">재작업</span><span v-if="delayed(f)" class="flag f-delay">지연</span><span v-if="f.change" class="flag f-change">변경요청</span></div>

      <div v-if="f.hold && !f.excluded" class="callout f-hold" style="margin-top:14px"><b>보류 사유</b> · {{ f.hold }}</div>
      <div v-if="f.excluded" class="callout f-excl" style="margin-top:14px"><b>범위 제외</b> · {{ f.excluded }}</div>
      <div v-if="f.change" class="callout f-change" style="margin-top:14px"><b>변경요청</b> · {{ f.change }}</div>

      <section><h3>기능 설명</h3><p style="margin:0">{{ f.desc }}</p></section>
      <section>
        <h3>수용 기준</h3>
        <ul class="criteria"><li v-for="(c, i) in f.criteria" :key="i" :class="{pass: criteriaPass(f)}"><i>{{ criteriaPass(f) ? '✓' : '' }}</i><span>{{ c }}</span></li></ul>
        <p v-if="f.test && f.status >= 4" class="small muted" style="margin:8px 0 0">내부테스트 결과: {{ f.test }}</p>
      </section>
      <section>
        <h3>정보</h3>
        <dl class="kv">
          <dt>업무 영역</dt><dd>{{ areaName(f.area) }}</dd>
          <dt>단계</dt><dd>{{ phaseName(f.phase) }}</dd>
          <dt>우선순위</dt><dd>{{ f.priority }}</dd>
          <dt>예정 완료</dt><dd class="num">{{ f.due }}</dd>
          <dt>요구사항 출처</dt><dd>{{ f.source }}</dd>
          <template v-if="!clientMode"><dt>담당 (내부)</dt><dd>{{ f.assignee || '-' }}</dd><dt>공수 (내부)</dt><dd>{{ f.effort }}일</dd></template>
        </dl>
      </section>
      <section>
        <h3>처리 이력</h3>
        <ul class="timeline">
          <li v-for="(h, i) in history(f)" :key="i" :style="{'--c': 'var(--c' + h.stage + ')'}">
            <div>{{ h.text }}<span v-if="h.internal" class="flag f-excl">내부</span></div>
            <div class="when num">{{ h.at }} · {{ h.who }}</div>
          </li>
        </ul>
      </section>
      <div v-if="clientMode && f.status===4 && !f.excluded" class="actions">
        <template v-if="can.confirm">
          <button class="btn ok" @click="askOtp('confirm', f)">확인 (수용 기준 충족)</button>
          <button class="btn danger" @click="askOtp('reject', f)">반려</button>
        </template>
        <span v-else class="small muted">조회 권한입니다. 확인·반려는 담당자나 책임자가 할 수 있습니다.</span>
      </div>
    </template>
  </aside>
</div>

<!-- 인증 모달 -->
<div v-if="modal" class="modal-scrim" @click.self="modal = null">
  <form class="modal" role="dialog" aria-modal="true" @submit.prevent="submitModal">
    <h3>{{ {confirm: '기능 확인', reject: '기능 반려', sign: '확인서 서명', certReturn: '확인서 되돌리기'}[modal.kind] }}</h3>
    <p class="small muted" style="margin:0">
      <template v-if="modal.kind==='confirm'">{{ modal.payload.id }} {{ modal.payload.title }}을(를) 수용 기준대로 확인합니다. 확인하면 완료로 바뀌고 확인서에 기록됩니다.</template>
      <template v-if="modal.kind==='reject'">{{ modal.payload.id }} {{ modal.payload.title }}을(를) 반려합니다. 개발팀이 사유를 보고 재작업합니다.</template>
      <template v-if="modal.kind==='sign'">{{ modal.payload.no }}에 발주사 책임자로 서명합니다. 서명하면 문서를 고칠 수 없습니다.</template>
      <template v-if="modal.kind==='certReturn'">{{ modal.payload.no }}를 서명하지 않고 수행사에 되돌립니다.</template>
    </p>
    <div v-if="modal.kind==='reject' || modal.kind==='certReturn'" class="field">
      <label for="reason">사유</label>
      <textarea id="reason" v-model="modal.reason" placeholder="예: 반품 사유 목록에 '오배송'이 없습니다"></textarea>
    </div>
    <div class="field">
      <label for="otp">{{ maskEmail(session.email) }}로 보낸 6자리 인증번호</label>
      <input id="otp" class="otp" v-model="modal.input" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <span class="small muted">시연용 인증번호: <b class="mono">{{ modal.code }}</b></span>
    </div>
    <div v-if="modal.err" class="error">{{ modal.err }}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button type="button" class="btn" @click="modal = null">취소</button>
      <button class="btn" :class="modal.kind==='reject' || modal.kind==='certReturn' ? 'danger' : 'primary'">{{ {confirm: '확인', reject: '반려', sign: '서명', certReturn: '되돌리기'}[modal.kind] }}</button>
    </div>
  </form>
</div>

<div v-if="toastMsg" class="toast" role="status">{{ toastMsg }}</div>
</template>
</script>
</body>
</html>
